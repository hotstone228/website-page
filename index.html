<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <title>Flow — живая сетка</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="splash" aria-label="Абстрактная анимация из светящихся точек">
      <canvas id="dot-field" aria-hidden="true"></canvas>
      <div class="vignette" aria-hidden="true"></div>

      <div class="brand" aria-label="Flow">
        <span class="brand__mark"></span>
        <span>FLOW</span>
      </div>

      <p class="hint">ДВИГАЙТЕ КУРСОРОМ <span>·</span> ИССЛЕДУЙТЕ</p>
    </main>
    <noscript>Для отображения заставки включите JavaScript.</noscript>
    <script src="script.js"></script>
  </body>
</html>
